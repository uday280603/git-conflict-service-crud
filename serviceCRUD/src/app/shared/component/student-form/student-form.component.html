<div class="card">
  <div class="card-body">
    <h3 >{{isInEditMode ? 'Update Student' :'Add Student'}}</h3>
    <form #studForm="ngForm" (ngSubmit)="onStudentSubmit()">
      <div class="form-group">
        <label for="fname">First Name</label>
        <input ngModel required name="fname" type="text" class="form-control" />
      </div>
      <div class="form-group">
        <label for="lname">Last Name</label>
        <input ngModel required name="lname" type="text" class="form-control" />
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input ngModel required name="email" type="text" class="form-control" />
      </div>
      <div class="form-group">
        <label for="contact">Contact</label>
        <input
          ngModel
          required
          name="contact"
          type="text"
          class="form-control"
        />
      </div>
      <div class="form-group">
        <label for="course">Course</label>
        <input
          ngModel
          required
          name="course"
          type="text"
          class="form-control"
        />
      </div>
      <div class="form-group">
        <label for="course">Course</label>
        <select name="isActive" id="isActive" required class="form-control">
          <option value="true">Yes</option>
          <option value="false">No</option>
        </select>
      </div>
      <button
      *ngIf="!isInEditMode"
      mat-raised-button color="primary" class="w-100"[disabled]="studForm.invalid">Add Student</button>
      <button
      (click)="onUpdate()" 
      *ngIf="isInEditMode"
      mat-raised-button color="warn" class="w-100">Update Student</button>
     
    </form>
  </div>
</div>
